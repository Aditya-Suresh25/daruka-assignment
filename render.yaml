services:
  - type: web
    name: darukaa-earth-api
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    preDeployCommand: python -m alembic -c backend/alembic.ini upgrade head
    startCommand: uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
